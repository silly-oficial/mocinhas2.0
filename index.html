<!doctype html>
<html lang="pt-BR" data-theme="orix">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      try {
        document.documentElement.dataset.theme = "orix";
        document.documentElement.classList.remove("dark");
        document.querySelector('meta[name="theme-color"]').content = "#FFFFFF";
      } catch (_) {}
    </script>
    <title>mocinhas</title>
    <meta name="description" content="Mocinhas: fotos e vídeos publicados pela administração, com comentários, favoritos e um universo de conteúdo." />
    <meta property="og:title" content="mocinhas" />
    <meta property="og:description" content="Mocinhas: fotos e vídeos publicados pela administração, com comentários, favoritos e um universo de conteúdo." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/fonts/plus-jakarta.css">
    <style>
      html { --boot-bg:#09090e; --boot-text:#fff; --boot-muted:#94a3b8; }
      html[data-theme="orix"] { --boot-bg:#fff; --boot-text:#12172a; --boot-muted:#6b7280; color-scheme:light; }
      html[data-theme="lilac"] { --boot-bg:#e8deff; --boot-text:#201832; --boot-muted:#756d87; color-scheme:light; }
      html[data-theme="orely"] { --boot-bg:#f8f5ff; --boot-text:#171326; --boot-muted:#756d87; color-scheme:light; }
      html,body { background:var(--boot-bg); color:var(--boot-text); margin:0; padding:0; min-height:100dvh; }
      .boot-screen { min-height:100dvh; display:grid; place-content:center; gap:12px; text-align:center; font-family:'Plus Jakarta Sans',sans-serif; }
      .boot-screen h1 { font-size:24px; margin:0; letter-spacing:-.5px; }
      .boot-screen p { color:var(--boot-muted); font-size:13px; }
    </style>
  </head>
  <body class="antialiased font-sans">
    <div id="root"><div class="boot-screen"><h1>mocinhas</h1><p>Carregando...</p></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
